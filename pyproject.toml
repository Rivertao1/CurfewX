[project]
name = "curfew-x"
version = "0.1.2"
description = "A scheduled curfew plugin for MCDReforged"
authors = [
    { name = "River_tao" },
]
requires-python = ">=3.9"
dependencies = [
    "mcdreforged==2.15.7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
